<div class="d-grid gap-4">
    {% for group in spot_groups %}
        <section class="parking-map">
            <div class="parking-lot-heading">
                <div><strong>{{ group.lot_name }}</strong><div class="text-secondary small">Patro {{ group.floor }}</div></div>
                <span class="status-pill">{{ group.spots|length }} míst</span>
            </div>
            <div class="parking-row" style="grid-template-columns: repeat({{ group.layout_columns }}, minmax(80px, 1fr));">
                {% for spot in group.spots %}
                    {% if spot.cell_kind == 'EMPTY' %}
                        <div class="grid-empty-cell" aria-hidden="true"></div>
                    {% elif spot.cell_kind == 'PILLAR' %}
                        <div class="grid-obstacle-cell" title="Pilíř / překážka">
                            <i class="bi bi-columns-gap"></i>
                        </div>
                    {% else %}
                    <label class="spot-option {% if spot.is_locked_by_other or spot.is_occupied and spot.id != editing_reservation.spot_id %}disabled{% endif %}">
                        <input
                            type="radio"
                            name="spot"
                            id="spot-{{ spot.id }}"
                            value="{{ spot.id }}"
                            {% if selected_spot_id and selected_spot_id == spot.id %}checked{% endif %}
                            {% if spot.is_locked_by_other or spot.is_occupied and spot.id != editing_reservation.spot_id %}disabled{% endif %}
                        >
                        <span class="spot-card">
                            <div class="d-flex justify-content-between">
                                <span class="spot-number">{{ spot.number }}</span>
                                {% if spot.spot_type == 'DISABLED_ONLY' %}
                                    <i class="bi bi-person-wheelchair spot-symbol"></i>
                                {% elif spot.spot_type == 'EV_ONLY' %}
                                    <i class="bi bi-lightning-charge-fill spot-symbol"></i>
                                {% else %}
                                    <i class="bi bi-car-front-fill spot-symbol"></i>
                                {% endif %}
                            </div>
                            {% if editing_reservation and spot.id == editing_reservation.spot_id %}
                                <span class="spot-status">Vaše místo</span>
                            {% elif spot.is_locked_by_other %}
                                <span class="spot-status selected-by-other">Vybráno jiným uživatelem</span>
                            {% elif spot.is_occupied %}
                                <span class="spot-status">Obsazené</span>
                            {% else %}
                                <span class="spot-status">Volné</span>
                            {% endif %}
                        </span>
                    </label>
                    {% endif %}
                {% endfor %}
            </div>
        </section>
    {% endfor %}
</div>
