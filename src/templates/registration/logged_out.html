{% extends 'base.html' %}

{% block title %}Odhlášeno | Rezervační systém{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="col-md-7 col-lg-6">
        <div class="card bg-body p-4 p-md-5 text-center">
            <div class="mb-4">
                <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-success-subtle text-success mb-3" style="width: 72px; height: 72px;">
                    <i class="bi bi-box-arrow-right fs-2"></i>
                </div>
                <h1 class="fw-bold mb-2">Úspěšně odhlášeno</h1>
                <p class="text-secondary mb-0">Vaše relace byla ukončena. Pro další práci se můžete znovu přihlásit.</p>
            </div>

            <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                <a href="{% url 'login' %}" class="btn btn-primary px-4 py-2">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Přihlásit se znovu
                </a>
                <a href="{% url 'index' %}" class="btn btn-outline-secondary px-4 py-2">
                    <i class="bi bi-house-door me-1"></i> Na úvod
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
